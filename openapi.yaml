openapi: 3.0.0
info:
  title: Omnia Voice API
  description: |
    The Omnia Voice API allows you to programmatically manage voice agents, create voice calls, and integrate with your systems.

    ## Authentication
    All API requests require an API key in the `X-API-Key` header.

    ## Rate Limiting
    API requests are rate limited to 50 requests per minute per API key.

    ## Base URL
    ```
    https://dashboard.omnia-voice.com/api/v1
    ```
  version: 1.0.0
  contact:
    email: support@omnia-voice.com

servers:
  - url: https://dashboard.omnia-voice.com/api/v1
    description: Production server

security:
  - ApiKeyAuth: []

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for authentication

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string
            code:
              type: string
            details:
              type: object

    # ========== AGENTS ==========
    Agent:
      type: object
      properties:
        id:
          type: string
          example: "cm1abc123def"
        name:
          type: string
          example: "Customer Support Bot"
        description:
          type: string
          example: "Handles customer inquiries"
        status:
          type: string
          enum: [ACTIVE, INACTIVE, SUSPENDED]
        type:
          type: string
          enum: [standard, custom]
        workspaceId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        standardConfig:
          $ref: '#/components/schemas/AgentConfig'
        actions:
          type: array
          items:
            type: string
        knowledgeBases:
          type: array
          items:
            type: string

    AgentConfig:
      type: object
      properties:
        languageId:
          type: string
        voiceId:
          type: string
        greeting:
          type: string
          example: "Hello! How can I help you today?"
        basePrompt:
          type: string
          example: "You are a helpful customer support agent."
        context:
          type: string
          nullable: true
        questions:
          type: string
          nullable: true
        customInstructions:
          type: string
          nullable: true
        recordingEnabled:
          type: boolean
          default: true
        language:
          $ref: '#/components/schemas/Language'
        voice:
          $ref: '#/components/schemas/Voice'

    CreateAgentRequest:
      type: object
      required:
        - name
        - config
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: "Customer Support Bot"
        description:
          type: string
          example: "Handles customer inquiries"
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
          default: ACTIVE
        config:
          type: object
          required:
            - languageId
            - voiceId
            - greeting
            - basePrompt
          properties:
            languageId:
              type: string
              description: ID of the language (get from /languages endpoint)
              example: "clx1234567890"
            voiceId:
              type: string
              description: ID of the voice (get from /voices endpoint)
              example: "clx0987654321"
            greeting:
              type: string
              description: First message the agent says when call starts
              example: "Hello! Thank you for calling. How can I help you today?"
            basePrompt:
              type: string
              description: System prompt defining the agent's personality and role
              example: "You are a friendly and professional customer support agent for Acme Corp."
            context:
              type: string
              description: Additional context about the business/product
              example: "Acme Corp sells cloud software. Common issues include login problems and billing questions."
            questions:
              type: string
              description: Questions the agent should ask
              example: "Ask for the customer's email and order number."
            customInstructions:
              type: string
              description: Special behavioral instructions
              example: "Always offer to escalate to a human if the customer is frustrated."
            recordingEnabled:
              type: boolean
              default: true
              description: Whether to record the call
        functions:
          type: array
          description: Built-in functions to enable
          items:
            type: object
            properties:
              type:
                type: string
                enum: [CALL_TRANSFER, END_CALL, CALENDAR_CHECK, CALENDAR_BOOK]
              name:
                type: string
              description:
                type: string
              config:
                type: object
        actions:
          type: array
          description: IDs of actions to assign
          items:
            type: string
        knowledgeBases:
          type: array
          description: IDs of knowledge bases to assign
          items:
            type: string

    UpdateAgentRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
        status:
          type: string
          enum: [ACTIVE, INACTIVE, SUSPENDED]
        config:
          type: object
          properties:
            languageId:
              type: string
            voiceId:
              type: string
            greeting:
              type: string
            basePrompt:
              type: string
            context:
              type: string
              nullable: true
            questions:
              type: string
              nullable: true
            customInstructions:
              type: string
              nullable: true
            recordingEnabled:
              type: boolean

    # ========== CALLS ==========
    CreateCallRequest:
      type: object
      required:
        - agentId
      properties:
        agentId:
          type: string
          description: ID of the agent to use
          example: "cm1abc123def"
        connectionType:
          type: string
          enum: [twilio, telnyx, plivo, websocket, webrtc]
          default: twilio
          description: Telephony provider or connection type
        websocket:
          type: object
          description: Required when connectionType is 'websocket'
          properties:
            inputSampleRate:
              type: integer
              description: Input audio sample rate in Hz
              example: 8000
            outputSampleRate:
              type: integer
              description: Output audio sample rate in Hz
              example: 8000
        metadata:
          type: object
          description: Custom metadata for the call
          additionalProperties: true

    CreateInlineCallRequest:
      type: object
      required:
        - systemPrompt
        - voice
        - language
      properties:
        systemPrompt:
          type: string
          description: The system prompt for the AI
          example: "You are a helpful assistant for booking appointments."
        voice:
          type: string
          description: Voice ID or name
          example: "Mark"
        language:
          type: string
          description: Language code
          example: "en"
        model:
          type: string
          description: AI model to use
          example: "fixie-ai/ultravox-70B"
        temperature:
          type: number
          minimum: 0
          maximum: 2
          default: 0
        firstSpeaker:
          type: string
          enum: [agent, user]
          default: agent
          description: Who speaks first
        selectedTools:
          type: array
          description: Tools in Ultravox format
          items:
            type: object
        recordingEnabled:
          type: boolean
          default: true
        connectionType:
          type: string
          enum: [twilio, telnyx, plivo, websocket, webrtc]
          default: twilio
        websocket:
          type: object
          properties:
            inputSampleRate:
              type: integer
              example: 8000
            outputSampleRate:
              type: integer
              example: 8000
            codec:
              type: string
              enum: [pcm, g711]
              default: g711
            enableAudioBuffering:
              type: boolean
              default: false
            twilioStream:
              type: boolean
              default: false
        metadata:
          type: object
          additionalProperties: true

    CreateCallResponse:
      type: object
      properties:
        id:
          type: string
          description: Call ID
          example: "call_abc123"
        websocketUrl:
          type: string
          format: uri
          description: WebSocket URL to connect to
          example: "wss://voice.omnia-voice.com/abc123"
        status:
          type: string
          enum: [created, connecting, connected, ended]
        connectionType:
          type: string
          enum: [twilio, telnyx, plivo, websocket, webrtc]
        agent:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            description:
              type: string
        createdAt:
          type: string
          format: date-time

    CallLog:
      type: object
      properties:
        id:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        duration:
          type: integer
          description: Duration in seconds
        status:
          type: string
        summary:
          type: string
        shortSummary:
          type: string
        transcript:
          type: string

    # ========== TOOLS ==========
    Tool:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [http, client]
          description: "http = server-side HTTP call, client = client-side via WebSocket"
        name:
          type: string
        modelToolName:
          type: string
          description: Name the AI uses to invoke the tool
        description:
          type: string
        baseUrlPattern:
          type: string
          description: API endpoint URL (for http type)
        httpMethod:
          type: string
          enum: [GET, POST, PUT, DELETE, PATCH]
        dynamicParameters:
          type: object
          description: Parameters extracted by AI from conversation
          additionalProperties:
            type: object
            properties:
              location:
                type: string
                enum: [body, header, query, path]
              schema:
                type: object
                properties:
                  type:
                    type: string
                    enum: [string, number, boolean, object, array]
                  description:
                    type: string
                  enum:
                    type: array
                    items:
                      type: string
              required:
                type: boolean
        automaticParameters:
          type: object
          description: Pre-configured parameters (API keys, session IDs, etc.)
          additionalProperties:
            type: object
            properties:
              location:
                type: string
                enum: [body, header, query, path]
              knownValue:
                type: string
                description: |
                  Literal value or system variable:
                  - KNOWN_PARAM_CALL_ID
                  - KNOWN_PARAM_USER_EMAIL
                  - KNOWN_PARAM_PHONE_NUMBER
                  - Or any literal string
        createdAt:
          type: string
          format: date-time

    CreateToolRequest:
      type: object
      required:
        - type
        - name
        - modelToolName
      properties:
        type:
          type: string
          enum: [http, client]
        name:
          type: string
          example: "Book Appointment"
        modelToolName:
          type: string
          example: "bookAppointment"
        description:
          type: string
          example: "Books an appointment for the caller"
        baseUrlPattern:
          type: string
          example: "https://api.example.com/appointments"
        httpMethod:
          type: string
          enum: [GET, POST, PUT, DELETE, PATCH]
        dynamicParameters:
          type: object
          additionalProperties:
            type: object
        automaticParameters:
          type: object
          additionalProperties:
            type: object

    # ========== CONFIG ==========
    Voice:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        previewUrl:
          type: string
        languageCode:
          type: string

    Language:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
        name:
          type: string
        isActive:
          type: boolean

    PaginatedResponse:
      type: object
      properties:
        data:
          type: array
          items: {}
        pagination:
          type: object
          properties:
            page:
              type: integer
            limit:
              type: integer
            total:
              type: integer
            hasMore:
              type: boolean

paths:
  # ========== AGENTS ==========
  /agents:
    get:
      summary: List agents
      description: Get all agents for the authenticated user
      operationId: listAgents
      tags:
        - Agents
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 100
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, INACTIVE, SUSPENDED]
        - name: search
          in: query
          schema:
            type: string
          description: Search by name or description
      responses:
        '200':
          description: List of agents
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Agent'

    post:
      summary: Create agent
      description: Create a new voice agent
      operationId: createAgent
      tags:
        - Agents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentRequest'
            examples:
              basic:
                summary: Basic agent
                value:
                  name: "Customer Support Bot"
                  description: "Handles customer inquiries"
                  config:
                    languageId: "clx1234567890"
                    voiceId: "clx0987654321"
                    greeting: "Hello! How can I help you today?"
                    basePrompt: "You are a helpful customer support agent."
                    recordingEnabled: true
              advanced:
                summary: Agent with context and instructions
                value:
                  name: "Sales Agent"
                  description: "Qualifies leads and books demos"
                  status: "ACTIVE"
                  config:
                    languageId: "clx1234567890"
                    voiceId: "clx0987654321"
                    greeting: "Hi there! Thanks for your interest in our product."
                    basePrompt: "You are a friendly sales representative for Acme Software."
                    context: "Acme Software provides CRM solutions starting at $49/month."
                    questions: "Ask about their current CRM, team size, and pain points."
                    customInstructions: "If they seem interested, offer to schedule a demo."
                    recordingEnabled: true
      responses:
        '201':
          description: Agent created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /agents/{id}:
    get:
      summary: Get agent
      operationId: getAgent
      tags:
        - Agents
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Agent details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '404':
          description: Agent not found

    put:
      summary: Update agent
      operationId: updateAgent
      tags:
        - Agents
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAgentRequest'
      responses:
        '200':
          description: Agent updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'

    delete:
      summary: Delete agent
      operationId: deleteAgent
      tags:
        - Agents
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Agent deleted

  # ========== CALLS ==========
  /calls/create:
    post:
      summary: Create call with agent
      description: |
        Create a voice call session using a pre-configured agent.
        Returns a WebSocket URL to connect your telephony provider.
      operationId: createCall
      tags:
        - Calls
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCallRequest'
            examples:
              webrtc:
                summary: Browser WebRTC call
                value:
                  agentId: "cm1abc123def"
                  connectionType: "webrtc"
              twilio:
                summary: Twilio integration
                value:
                  agentId: "cm1abc123def"
                  connectionType: "twilio"
              websocket:
                summary: Custom WebSocket (SIP/telephony)
                value:
                  agentId: "cm1abc123def"
                  connectionType: "websocket"
                  websocket:
                    inputSampleRate: 8000
                    outputSampleRate: 8000
      responses:
        '201':
          description: Call created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCallResponse'
              example:
                id: "call_abc123"
                websocketUrl: "wss://voice.omnia-voice.com/session123"
                status: "created"
                connectionType: "webrtc"
                agent:
                  id: "cm1abc123def"
                  name: "Customer Support Bot"
                createdAt: "2025-01-01T12:00:00Z"
        '402':
          description: Insufficient balance
        '404':
          description: Agent not found

  /calls/inline:
    post:
      summary: Create inline call (no agent)
      description: |
        Create a voice call with inline configuration - no pre-created agent required.
        Pass the system prompt, voice, and tools directly in the request.
        Ideal for stateless integrations.
      operationId: createInlineCall
      tags:
        - Calls
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInlineCallRequest'
            examples:
              basic:
                summary: Simple inline call
                value:
                  systemPrompt: "You are a helpful assistant."
                  voice: "Mark"
                  language: "en"
                  connectionType: "webrtc"
              withTools:
                summary: Inline call with tools
                value:
                  systemPrompt: "You are an appointment booking assistant."
                  voice: "Sarah"
                  language: "en"
                  connectionType: "websocket"
                  websocket:
                    inputSampleRate: 8000
                    outputSampleRate: 8000
                    codec: "g711"
                  selectedTools:
                    - temporaryTool:
                        modelToolName: "bookAppointment"
                        description: "Book an appointment"
                        dynamicParameters:
                          - name: "date"
                            location: "PARAMETER_LOCATION_BODY"
                            schema:
                              type: "string"
                              description: "Appointment date"
                            required: true
                        client: {}
      responses:
        '201':
          description: Call created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  websocketUrl:
                    type: string
                  status:
                    type: string
                  connectionType:
                    type: string
                  createdAt:
                    type: string
        '402':
          description: Insufficient balance

  /calls:
    get:
      summary: List call logs
      operationId: listCalls
      tags:
        - Calls
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: status
          in: query
          schema:
            type: string
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: List of calls
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/CallLog'

  /calls/{id}:
    get:
      summary: Get call details
      operationId: getCall
      tags:
        - Calls
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Call details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallLog'
        '404':
          description: Call not found

  # ========== TOOLS ==========
  /agent-tools:
    get:
      summary: List tools
      operationId: listTools
      tags:
        - Tools
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: type
          in: query
          schema:
            type: string
            enum: [http, client]
      responses:
        '200':
          description: List of tools
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Tool'

    post:
      summary: Create tool
      operationId: createTool
      tags:
        - Tools
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateToolRequest'
            examples:
              httpTool:
                summary: HTTP tool (server-side)
                value:
                  type: "http"
                  name: "Book Appointment"
                  modelToolName: "bookAppointment"
                  description: "Books an appointment for the caller"
                  baseUrlPattern: "https://api.example.com/appointments"
                  httpMethod: "POST"
                  automaticParameters:
                    Authorization:
                      location: "header"
                      knownValue: "Bearer sk-your-api-key"
                  dynamicParameters:
                    date:
                      location: "body"
                      schema:
                        type: "string"
                        description: "Appointment date (YYYY-MM-DD)"
                      required: true
                    time:
                      location: "body"
                      schema:
                        type: "string"
                        description: "Appointment time (HH:MM)"
                      required: true
              clientTool:
                summary: Client tool (WebSocket)
                value:
                  type: "client"
                  name: "Transfer Call"
                  modelToolName: "transferCall"
                  description: "Transfer the call to another department"
                  dynamicParameters:
                    department:
                      schema:
                        type: "string"
                        description: "Department to transfer to"
                        enum: ["sales", "support", "billing"]
                      required: true
      responses:
        '201':
          description: Tool created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tool'

  /agent-tools/{id}:
    get:
      summary: Get tool
      operationId: getTool
      tags:
        - Tools
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Tool details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tool'

    patch:
      summary: Update tool
      operationId: updateTool
      tags:
        - Tools
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateToolRequest'
      responses:
        '200':
          description: Tool updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tool'

    delete:
      summary: Delete tool
      operationId: deleteTool
      tags:
        - Tools
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Tool deleted

  /agent-tools/system:
    get:
      summary: List system tools
      description: Get available built-in system tools
      operationId: listSystemTools
      tags:
        - Tools
      responses:
        '200':
          description: List of system tools
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        toolName:
                          type: string
                        description:
                          type: string

  /agents/{id}/tools:
    get:
      summary: List agent's tools
      operationId: listAgentTools
      tags:
        - Tools
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Agent's assigned tools
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      customTools:
                        type: array
                        items:
                          $ref: '#/components/schemas/Tool'
                      systemTools:
                        type: array
                        items:
                          type: object
                      totalTools:
                        type: integer

    post:
      summary: Assign tools to agent
      operationId: assignTools
      tags:
        - Tools
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - toolIds
              properties:
                toolIds:
                  type: array
                  items:
                    type: string
                  minItems: 1
            example:
              toolIds: ["tool_abc123", "tool_def456"]
      responses:
        '200':
          description: Tools assigned
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  assigned:
                    type: integer
                  alreadyAssigned:
                    type: integer

  /agents/{id}/tools/{toolId}:
    delete:
      summary: Remove tool from agent
      operationId: removeToolFromAgent
      tags:
        - Tools
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: toolId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Tool removed

  # ========== PHONE NUMBERS ==========
  /numbers:
    get:
      summary: List phone numbers
      operationId: listNumbers
      tags:
        - Phone Numbers
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, INACTIVE]
      responses:
        '200':
          description: List of phone numbers
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        phoneNumber:
                          type: string
                        friendlyName:
                          type: string
                        agentId:
                          type: string
                        status:
                          type: string
                          enum: [ACTIVE, INACTIVE]

  /numbers/{id}:
    get:
      summary: Get phone number
      operationId: getNumber
      tags:
        - Phone Numbers
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Phone number details

  # ========== CONFIGURATION ==========
  /voices:
    get:
      summary: List voices
      description: Get available voices for agent configuration
      operationId: listVoices
      tags:
        - Configuration
      parameters:
        - name: languageCode
          in: query
          schema:
            type: string
          description: Filter by language code (e.g., "en", "es")
        - name: isActive
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: List of voices
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Voice'
                  groupedByLanguage:
                    type: object
                  total:
                    type: integer

  /languages:
    get:
      summary: List languages
      description: Get available languages for agent configuration
      operationId: listLanguages
      tags:
        - Configuration
      parameters:
        - name: isActive
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: List of languages
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Language'
                  total:
                    type: integer

tags:
  - name: Agents
    description: Create and manage voice agents
  - name: Calls
    description: Create and manage voice calls
  - name: Tools
    description: Create and manage agent tools
  - name: Phone Numbers
    description: Manage phone number assignments
  - name: Configuration
    description: Get available voices and languages
